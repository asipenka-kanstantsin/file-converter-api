services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: app
      POSTGRES_USER: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  s3:
    # MinIO no longer publishes public images; SeaweedFS provides the S3 API for dev and tests.
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  s3-init:
    image: amazon/aws-cli
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: s3-access-key
      AWS_SECRET_ACCESS_KEY: s3-secret-key
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://s3:8333 s3 ls >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://s3:8333 s3 mb s3://app-dev 2>/dev/null;
      aws --endpoint-url http://s3:8333 s3 mb s3://app-test 2>/dev/null;
      aws --endpoint-url http://s3:8333 s3 ls"

volumes:
  postgres-data:
  s3-data:
