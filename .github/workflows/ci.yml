name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # postinstall runs `prisma generate`; e2e tests read .env.test
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
    # Optional: the e2e runs start a PostgreSQL 18 cluster of their own when nothing answers on
    # DATABASE_URL (decision T1). The service container is kept because it is faster than initdb
    # on every run, and it keeps the "an existing server is used" branch covered.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_PASSWORD: app
          POSTGRES_USER: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
