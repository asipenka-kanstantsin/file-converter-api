  /api/admin/users:
    get:
      operationId: admin_listUsers
      tags: [admin]
      summary: List users
      description: |
        Cursor-paginated (`nextCursor`; `null` on the last page). The cursor is tied to the sort,
        order, `q` and `status` it was issued for; reuse with others answers 400
        `PAGINATION_CURSOR_INVALID`. `q` matches an exact id, or the start of the e-mail or the
        display name (case-insensitive). Deleted accounts appear only with `status=deleted`.
        Sorting by `last_login` puts accounts that never signed in last (`desc`) or first (`asc`).
      x-permission: users@list
      security:
        - accessCookie: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 1000
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          description: 'Search (trimmed): an id, or the start of an e-mail or display name.'
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: status
          in: query
          required: false
          description: Only accounts with this status.
          schema:
            type: string
            enum: [active, blocked, deleted, pending_verification]
        - name: sort
          in: query
          required: false
          description: Sort key.
          schema:
            type: string
            enum: [created_at, email, last_login]
            default: created_at
        - name: order
          in: query
          required: false
          description: Sort direction.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: One page of users.
          headers:
