        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/transformations/history:
    get:
      operationId: transformations_ownHistory
      tags: [transformations]
      summary: One's own conversion history
      description: |
        Every conversion attempt (success or error), newest first, cursor-paginated. Rows past the
        retention period are not listed (they are deleted shortly). A cursor is tied to the filters
        it was issued for. `downloadable` says whether a saved result can be downloaded.
      security:
        - accessCookie: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 1000
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: type
          in: query
          required: false
          description: Only file or only image conversions.
          schema:
            type: string
            enum: [file, image]
        - name: sourceFormat
          in: query
          required: false
          description: Only conversions from this format.
          schema:
            type: string
            enum: [csv, jpeg, json, png, svg, xml, yaml]
        - name: targetFormat
          in: query
          required: false
          description: Only conversions to this format.
          schema:
            type: string
            enum: [csv, jpeg, json, png, svg, xml, yaml]
        - name: status
          in: query
          required: false
          description: Only successful or only failed attempts.
          schema:
            type: string
            enum: [success, error]
        - name: createdAtFrom
          in: query
          required: false
          description: From this instant (inclusive). ISO-8601 with an offset (Z or ±hh:mm), at most millisecond precision, UTC year 1–9999.
          schema:
            type: string
            format: date-time
        - name: createdAtTo
          in: query
          required: false
          description: Up to this instant (inclusive); not before createdAtFrom. ISO-8601 with an offset (Z or ±hh:mm), at most millisecond precision, UTC year 1–9999.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of history, newest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          description: Invalid parameters or cursor.
          x-error-codes: [PAGINATION_CURSOR_INVALID, VALIDATION_FAILED]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOrValidationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/transformations/history/{itemId}/download:
    get:
      operationId: transformations_downloadResult
      tags: [transformations]
      summary: Download a saved result of my own
      description: |
        The result saved with `save=true`, streamed through the API (never a storage URL), until
        the retention period ends.
      security:
        - accessCookie: []
      parameters:
        - name: itemId
          in: path
          required: true
          description: The history item.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The saved result, streamed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Content-Disposition:
              required: true
              schema:
                type: string
                pattern: '^attachment; filename="[\w.-]+"$'
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema: {}
            application/xml:
              schema:
                type: string
            application/yaml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The item belongs to another user.
          x-error-codes: [AUTH_FORBIDDEN]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such item, or no saved result (not saved, or missing in storage).
          x-error-codes: [RESULT_NOT_FOUND, TRANSFORMATION_NOT_FOUND]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: The retention period is over; the result has been or is about to be removed.
          x-error-codes: [RESULT_EXPIRED]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: File storage is unavailable.
          x-error-codes: [STORAGE_UNAVAILABLE]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Default'

