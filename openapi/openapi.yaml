components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Access JWT (15 min), set by sign-in, confirmation and refresh.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh JWT (30 days), sent by the browser only to `POST /api/auth/refresh`.
    csrfCookie:
      type: apiKey
      in: cookie
      name: csrf_token
      description: Set by `GET /api/auth/csrf`.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must equal the `csrf_token` cookie (double submit).

  parameters:
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    SetSessionCookies:
      description: >-
        `access_token=<JWT>; Path=/api; HttpOnly; SameSite=Lax` (15 min) and
        `refresh_token=<JWT>; Path=/api/auth/refresh; HttpOnly; SameSite=Lax` (30 days); `Secure`
        outside local development.
      required: true
      schema:
        type: string
        pattern: '^(access|refresh)_token=[\w-]+\.[\w-]+\.[\w-]+;.*HttpOnly'
    ClearSessionCookies:
      description: >-
        Expires `access_token` (`Path=/api`) and `refresh_token` (`Path=/api/auth/refresh`) with
        the same attributes they were set with; logout also expires `login_challenge`.
      required: true
      schema:
        type: string
        pattern: '^(access_token|refresh_token|login_challenge)=;.*Expires=Thu, 01 Jan 1970'
    SetLoginBindingCookie:
      description: '`login_challenge=<challengeId>; Path=/api/auth/confirm; HttpOnly; SameSite=Lax` (10 min).'
      required: true
      schema:
        type: string
        pattern: '^login_challenge=[0-9a-f-]{36};.*HttpOnly'
    SetCsrfCookie:
      description: '`csrf_token=<random>; Path=/; SameSite=Lax` (not HttpOnly, so the client can echo it).'
      required: true
      schema:
        type: string
        pattern: '^csrf_token=[A-Za-z0-9_-]{43};'
    RequestId:
      description: Request id — echoed from a valid incoming `X-Request-Id` or generated.
      required: true
      schema:
        type: string
        pattern: '^[\w-]{1,64}$'
    RetryAfter:
      description: Seconds until the client may retry.
      required: true
      schema:
        type: integer
        minimum: 1
    RateLimitLimit:
      description: Requests allowed in the current window.
      required: true
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests left in the current window.
      required: true
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the window resets.
      required: true
      schema:
        type: integer
        minimum: 0

  schemas:
    ErrorCode:
      type: string
      description: Stable machine-readable error code. Clients branch on it, never on `detail`.
      enum:
        - AUTH_ACCOUNT_BLOCKED
        - AUTH_ACCOUNT_NOT_VERIFIED
        - AUTH_CHALLENGE_EXPIRED
        - AUTH_CHALLENGE_INVALID
        - AUTH_CHALLENGE_LOCKED
        - AUTH_CHALLENGE_OTHER_BROWSER
        - AUTH_CHALLENGE_SESSION_REQUIRED
        - AUTH_CODE_INVALID
        - AUTH_FORBIDDEN
        - AUTH_INVALID_CREDENTIALS
        - AUTH_REFRESH_INVALID
        - AUTH_UNAUTHENTICATED
        - CONFLICT
        - CONVERSION_NOT_SUPPORTED
        - CONVERSION_TIMEOUT
        - CSRF_INVALID
        - FILE_EMPTY
        - FILE_ENCODING_INVALID
        - FILE_PARSE_ERROR
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_SUPPORTED
        - IMAGE_TOO_LARGE
        - INTERNAL_ERROR
        - MALFORMED_REQUEST
        - PAGINATION_CURSOR_INVALID
        - PAYLOAD_TOO_LARGE
        - PHOTO_NOT_FOUND
        - RATE_LIMITED
        - RBAC_ACTION_IN_USE
        - RBAC_ACTION_NOT_ALLOWED
        - RBAC_GRANT_DUPLICATE
        - RBAC_GRANT_NOT_FOUND
        - RBAC_IN_USE
        - RBAC_LAST_ADMIN
        - RBAC_PERMISSION_NAME_TAKEN
        - RBAC_PERMISSION_NOT_FOUND
        - RBAC_ROLE_NAME_TAKEN
        - RBAC_ROLE_NOT_FOUND
        - RBAC_SYSTEM_ENTITY
        - REQUEST_REJECTED
        - RESULT_EXPIRED
        - RESULT_NOT_FOUND
        - ROUTE_NOT_FOUND
        - SERVICE_UNAVAILABLE
        - STORAGE_UNAVAILABLE
        - STRUCTURE_TOO_COMPLEX
        - SVG_UNSAFE
        - TRANSFORMATION_NOT_FOUND
        - UNSUPPORTED_MEDIA_TYPE
        - USER_EMAIL_TAKEN
        - USER_NOT_ACTIVE
        - USER_NOT_FOUND
        - VALIDATION_FAILED

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, detail]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Human-readable message (English). Display only; never parse it.
        context:
          type: object
          description: Safe, code-specific details; each response documents its own shape.

    RateLimitedEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            code:
              const: RATE_LIMITED
            context:
              type: object
              additionalProperties: false
              required: [retryAfter]
              properties:
                retryAfter:
                  type: integer
                  minimum: 1
                  description: Seconds until the client may retry (same as `Retry-After`).

    ServiceUnavailableEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [context]
          properties:
            code:
              const: SERVICE_UNAVAILABLE
            context:
              type: object
              additionalProperties: false
              required: [checks]
              properties:
                checks:
                  $ref: '#/components/schemas/HealthChecks'

    ValidationErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [context]
          properties:
            code:
              const: VALIDATION_FAILED
            context:
              type: object
              additionalProperties: false
              required: [fields]
              properties:
                fields:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [code, detail, path]
                    properties:
                      code:
                        type: string
                        description: zod issue code, e.g. `too_small`, `invalid_format`.
                      detail:
                        type: string
                      path:
                        type: string
                        description: Dot-joined field path, e.g. `email`.

    CodeInvalidEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [context]
          properties:
            code:
              const: AUTH_CODE_INVALID
            context:
              type: object
              additionalProperties: false
              required: [attemptsLeft]
              properties:
                attemptsLeft:
                  type: integer
                  minimum: 1

    Email:
      type: string
      format: email
      maxLength: 254
      description: Trimmed and lower-cased by the server.
      examples: [jane@example.com]

    Password:
      type: string
      minLength: 8
      maxLength: 128
      description: 8–128 characters with at least one letter and one digit.
      writeOnly: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'

    User:
      type: object
      additionalProperties: false
      required: [createdAt, email, id, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, blocked, deleted, pending_verification]
        createdAt:
          type: string
          format: date-time

    UserEnvelope:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    RoleName:
      type: string
      pattern: '^[a-z][a-z0-9_-]{1,49}$'
    PermissionName:
      type: string
      pattern: '^[a-z][a-z0-9.\-_]{1,63}$'
    Action:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,31}$'
    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/RoleName'
        description:
          type: string
          maxLength: 500
    Role:
      type: object
      additionalProperties: false
      required: [id, name, description, system, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        system:
          type: boolean
          description: Built in (`admin`, `user`); cannot be renamed or deleted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoleEnvelope:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'
    RoleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    PermissionInput:
      type: object
      required: [name, actions]
      properties:
        name:
          $ref: '#/components/schemas/PermissionName'
        actions:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Action'
    Permission:
      type: object
      additionalProperties: false
      required: [id, name, actions, system, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        actions:
          type: array
          items:
            type: string
        system:
          type: boolean
          description: Checked by the API itself; read-only.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PermissionEnvelope:
      type: object
      additionalProperties: false
      required: [permission]
      properties:
        permission:
          $ref: '#/components/schemas/Permission'
    PermissionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    GrantInput:
      type: object
      required: [roleId, permissionId]
      properties:
        roleId:
          type: string
          format: uuid
        permissionId:
          type: string
          format: uuid
        actions:
          type: array
          maxItems: 32
          uniqueItems: true
          description: Omitted or empty = every action of the permission.
          items:
            $ref: '#/components/schemas/Action'
    Grant:
      type: object
      additionalProperties: false
      required: [id, roleId, permissionId, actions, system, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        permissionId:
          type: string
          format: uuid
        actions:
          type: array
          description: Empty = every action of the permission.
          items:
            type: string
        system:
          type: boolean
          description: The protected grant `admin → rbac`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GrantEnvelope:
      type: object
      additionalProperties: false
      required: [grant]
      properties:
        grant:
          $ref: '#/components/schemas/Grant'
    GrantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
    UserRolesInput:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            format: uuid
    UserRoles:
      type: object
      additionalProperties: false
      required: [userId, roleIds]
      properties:
        userId:
          type: string
          format: uuid
        roleIds:
          type: array
          description: Explicitly assigned roles; the implicit `user` role is not listed.
          items:
            type: string
            format: uuid
    Settings:
      type: object
      additionalProperties: false
      required: [confirmation.login, confirmation.registration, convert.maxBytes.csv, convert.maxBytes.jpeg, convert.maxBytes.json, convert.maxBytes.png, convert.maxBytes.svg, convert.maxBytes.xml, convert.maxBytes.yaml, convert.svg.maxHeight, convert.svg.maxWidth, history.retentionDays]
      properties:
        confirmation.login:
          type: boolean
          description: Sign-in needs an e-mailed code or link.
        confirmation.registration:
          type: boolean
          description: Registration needs an e-mailed code or link.
        convert.maxBytes.csv:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted CSV input, in bytes.
        convert.maxBytes.jpeg:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted JPEG input, in bytes.
        convert.maxBytes.json:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted JSON input, in bytes.
        convert.maxBytes.png:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted PNG input, in bytes.
        convert.maxBytes.svg:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted SVG input, in bytes.
        convert.maxBytes.xml:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted XML input, in bytes.
        convert.maxBytes.yaml:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted YAML input, in bytes.
        convert.svg.maxHeight:
          type: integer
          minimum: 16
          maximum: 16384
          description: Largest raster height an SVG may be rendered to.
        convert.svg.maxWidth:
          type: integer
          minimum: 16
          maximum: 16384
          description: Largest raster width an SVG may be rendered to.
        history.retentionDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: How long history rows and saved results are kept.
    SettingsEnvelope:
      type: object
      additionalProperties: false
      required: [settings]
      properties:
        settings:
          $ref: '#/components/schemas/Settings'
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        confirmation.login:
          type: boolean
          description: Sign-in needs an e-mailed code or link.
        confirmation.registration:
          type: boolean
          description: Registration needs an e-mailed code or link.
        convert.maxBytes.csv:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted CSV input, in bytes.
        convert.maxBytes.jpeg:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted JPEG input, in bytes.
        convert.maxBytes.json:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted JSON input, in bytes.
        convert.maxBytes.png:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted PNG input, in bytes.
        convert.maxBytes.svg:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted SVG input, in bytes.
        convert.maxBytes.xml:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted XML input, in bytes.
        convert.maxBytes.yaml:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Largest accepted YAML input, in bytes.
        convert.svg.maxHeight:
          type: integer
          minimum: 16
          maximum: 16384
          description: Largest raster height an SVG may be rendered to.
        convert.svg.maxWidth:
          type: integer
          minimum: 16
          maximum: 16384
          description: Largest raster width an SVG may be rendered to.
        history.retentionDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: How long history rows and saved results are kept.

    Profile:
      type: object
      additionalProperties: false
      required: [id, email, photo, fields]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        photo:
          type: [string, 'null']
          description: API path of the photo (`/api/users/{userId}/photo`), never a storage URL.
        fields:
          type: object
          additionalProperties: false
          description: Only the fields allowed for the viewer.
          properties:
            displayName:
              type: [string, 'null']
            status:
              type: string
              enum: [active, blocked, deleted, pending_verification]
            createdAt:
              type: string
              format: date-time
            lastLoginAt:
              type: [string, 'null']
              format: date-time
    ProfileEnvelope:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'

    DeletionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: For audit and support.
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
        email:
          $ref: '#/components/schemas/Email'
        status:
          type: string
          enum: [active, blocked]
    EmailChangeRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail:
          $ref: '#/components/schemas/Email'
    OwnerConfirmationRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [challengeId, code]
          properties:
            challengeId:
              $ref: '#/components/schemas/ChallengeId'
            code:
              type: string
              pattern: '^\d{6}$'
        - type: object
          additionalProperties: false
          required: [token]
          properties:
            token:
              $ref: '#/components/schemas/MagicLinkToken'
    FileTooLargeEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [context]
          properties:
            context:
              type: object
              required: [maxBytes]
              properties:
                maxBytes:
                  type: integer
                format:
                  type: string
                  description: The source format whose limit applies (conversions).

    UserListItem:
      type: object
      additionalProperties: false
      required: [id, email, photo, createdAt, status, lastLoginAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        photo:
          type: [string, 'null']
          description: API path of the photo, never a storage URL.
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, blocked, deleted, pending_verification]
        lastLoginAt:
          type: [string, 'null']
          format: date-time
    UserList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserListItem'
        nextCursor:
          type: [string, 'null']

    FormatPairs:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [source, target]
        properties:
          source:
            type: string
          target:
            type: array
            items:
              type: string

    HistoryItem:
      type: object
      additionalProperties: false
      required: [id, type, sourceFormat, targetFormat, status, fileSize, durationMs, errorCode, createdAt, downloadable]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [file, image]
        sourceFormat:
          type: [string, 'null']
          description: Null when the format could not be determined.
        targetFormat:
          type: string
        status:
          type: string
          enum: [success, error]
        fileSize:
          type: integer
          description: Size of the input in bytes.
        durationMs:
          type: integer
        errorCode:
          type: [string, 'null']
          description: The error code when `status` is `error`.
        createdAt:
          type: string
          format: date-time
        downloadable:
          type: boolean
          description: A saved result exists and has not expired.
    HistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
        nextCursor:
          type: [string, 'null']

    ErrorOrValidationEnvelope:
      anyOf:
        - $ref: '#/components/schemas/ValidationErrorEnvelope'
        - $ref: '#/components/schemas/ErrorEnvelope'

    ChallengeId:
      type: string
      format: uuid
      description: Identifies a pending e-mail confirmation.

    ConfirmationRequired:
      type: object
      additionalProperties: false
      required: [challengeId, expiresAt, requiresConfirmation]
      properties:
        requiresConfirmation:
          const: true
        challengeId:
          $ref: '#/components/schemas/ChallengeId'
        expiresAt:
          type: string
          format: date-time
          description: When the e-mailed code and link stop working.

    ConfirmWithCodeRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId:
          $ref: '#/components/schemas/ChallengeId'
        code:
          type: string
          pattern: '^\d{6}$'
          writeOnly: true

    MagicLinkToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'

    ResendConfirmationRequest:
      type: object
      required: [challengeId]
      properties:
        challengeId:
          $ref: '#/components/schemas/ChallengeId'

    HealthChecks:
      type: object
      additionalProperties: false
      properties:
        database:
          type: string
          enum: [down, up]

    HealthReport:
      type: object
      additionalProperties: false
      required: [checks, status]
      properties:
        status:
          const: ok
        checks:
          $ref: '#/components/schemas/HealthChecks'

  responses:
    Healthy:
      description: Healthy.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthReport'
    ValidationFailed:
      description: Invalid input.
      x-error-codes: [VALIDATION_FAILED]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    Unauthenticated:
      description: >-
        No valid `access_token` cookie: missing, expired, tampered, or the account is no longer
        active or had its sessions revoked. Refresh the session and repeat the request.
      x-error-codes: [AUTH_UNAUTHENTICATED]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The caller's roles lack the operation's permission (`x-permission`).
      x-error-codes: [AUTH_FORBIDDEN]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenOrCsrf:
      description: The caller's roles lack the permission, or the CSRF check failed.
      x-error-codes: [AUTH_FORBIDDEN, CSRF_INVALID]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RoleNotFound:
      description: No role with this id.
      x-error-codes: [RBAC_ROLE_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionNotFound:
      description: No permission with this id.
      x-error-codes: [RBAC_PERMISSION_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GrantNotFound:
      description: No grant with this id.
      x-error-codes: [RBAC_GRANT_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GrantTargetNotFound:
      description: No such grant, role or permission.
      x-error-codes: [RBAC_GRANT_NOT_FOUND, RBAC_PERMISSION_NOT_FOUND, RBAC_ROLE_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UserNotFound:
      description: No user with this id.
      x-error-codes: [USER_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UserOrRoleNotFound:
      description: No such user, or a listed role does not exist (`context.roleId`).
      x-error-codes: [RBAC_ROLE_NOT_FOUND, USER_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RoleConflict:
      description: The name is taken, or a built-in role would be renamed.
      x-error-codes: [RBAC_ROLE_NAME_TAKEN, RBAC_SYSTEM_ENTITY]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionConflict:
      description: The name is taken, an action to remove is still granted (`context.actions`), or the permission is built in.
      x-error-codes: [RBAC_ACTION_IN_USE, RBAC_PERMISSION_NAME_TAKEN, RBAC_SYSTEM_ENTITY]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GrantConflict:
      description: >-
        The role already has a grant for this permission, the protected grant would change, or
        `rbac` would go to the implicit `user` role (every account would become an admin).
      x-error-codes: [RBAC_GRANT_DUPLICATE, RBAC_SYSTEM_ENTITY]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GrantInvalid:
      description: Invalid input, or actions the permission does not have (`context.actions`).
      x-error-codes: [RBAC_ACTION_NOT_ALLOWED, VALIDATION_FAILED]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOrValidationEnvelope'
    InUseOrSystem:
      description: Still referenced by grants or users, or built in.
      x-error-codes: [RBAC_IN_USE, RBAC_SYSTEM_ENTITY]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SystemEntity:
      description: The protected grant cannot be deleted.
      x-error-codes: [RBAC_SYSTEM_ENTITY]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UserRolesConflict:
      description: >-
        The implicit `user` role was listed, the last active admin would lose `admin`, or the
        account has not confirmed its registration (only active accounts hold roles).
      x-error-codes: [RBAC_LAST_ADMIN, RBAC_SYSTEM_ENTITY, USER_NOT_ACTIVE]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    FileTooLarge:
      description: The file is larger than allowed (`context.maxBytes`).
      x-error-codes: [FILE_TOO_LARGE]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileTooLargeEnvelope'
    FileTypeNotSupported:
      description: The content is not one of the allowed types.
      x-error-codes: [FILE_TYPE_NOT_SUPPORTED]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CsrfInvalid:
      description: The `X-CSRF-Token` header is missing or does not match the `csrf_token` cookie.
      x-error-codes: [CSRF_INVALID]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConfirmationRequired:
      description: >-
        A code and a magic link were e-mailed; the registration or sign-in completes after
        confirmation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfirmationRequired'
    Confirmed:
      description: >-
        The pending action is complete. Confirming a sign-in also sets the session cookies
        (`Set-Cookie` as for `POST /api/auth/login`); confirming a registration sets none.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Set-Cookie:
          description: >-
            Session cookies set when a sign-in was confirmed, or cleared (empty, expired) when an
            account deletion was.
          schema:
            type: string
            pattern: '^(access|refresh)_token=([\w-]+\.[\w-]+\.[\w-]+;.*HttpOnly|;.*Expires=Thu, 01 Jan 1970.*HttpOnly)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserEnvelope'
    ConfirmationFailed:
      description: >-
        Invalid input, unknown or already used challenge or link, expired challenge, or a wrong
        code (`context.attemptsLeft`).
      x-error-codes:
        - AUTH_CHALLENGE_EXPIRED
        - AUTH_CHALLENGE_INVALID
        - AUTH_CODE_INVALID
        - VALIDATION_FAILED
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ValidationErrorEnvelope'
              - $ref: '#/components/schemas/CodeInvalidEnvelope'
              - allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - properties:
                      code:
                        enum: [AUTH_CHALLENGE_EXPIRED, AUTH_CHALLENGE_INVALID]
    ChallengeLocked:
      description: Too many wrong codes; request a new code with `POST /api/auth/confirm/resend`.
      x-error-codes: [AUTH_CHALLENGE_LOCKED]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many requests.
      x-error-codes: [RATE_LIMITED]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitedEnvelope'
    ServiceUnavailable:
      description: A dependency is down.
      x-error-codes: [SERVICE_UNAVAILABLE]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableEnvelope'
    Default:
      description: >-
        Error any request can hit: unparsable or too large body, unsupported content
        encoding, a client error rejected by the framework, or an unexpected server error.
      x-error-codes:
        - INTERNAL_ERROR
        - MALFORMED_REQUEST
        - PAYLOAD_TOO_LARGE
        - REQUEST_REJECTED
        - STORAGE_UNAVAILABLE
        - UNSUPPORTED_MEDIA_TYPE
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
