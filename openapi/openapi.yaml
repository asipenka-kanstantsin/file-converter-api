  /api/convert:
    post:
      operationId: transformations_convertFile
      tags: [transformations]
      summary: Convert a CSV, JSON, XML or YAML file
      description: |
        Multipart fields: `file`, `targetFormat` (`csv` | `json` | `xml` | `yaml`), optional
        `save` (`true` | `false`, default false). The source format comes from the file's
        extension (`.csv`, `.json`, `.xml`, `.yaml`/`.yml`) or, without one, from the content
        (XML and JSON only). Input must be UTF-8 (a BOM is accepted); the size limit depends on
        the source format (admin setting). Every pair of different formats is supported; the
        rules for ambiguous pairs are in `docs/conversion-rules.md`. The result is produced
        completely before it is sent, so an error never yields a partial file. With `save=true`
        the result is stored after the response and becomes downloadable from the history.
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, targetFormat]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                targetFormat:
                  type: string
                  enum: [csv, json, xml, yaml]
                save:
                  type: string
                  enum: ['true', 'false']
      responses:
        '200':
          description: The converted file.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Content-Disposition:
              required: true
              schema:
                type: string
                pattern: '^attachment; filename="converted\.(csv|json|xml|yaml)"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema: {}
            application/xml:
              schema:
                type: string
            application/yaml:
              schema:
                type: string
        '400':
          description: Invalid parameters, an empty, non-UTF-8 or invalid file, a structure too deep, an unsupported pair, or a conversion that timed out (30 s).
          x-error-codes: [CONVERSION_NOT_SUPPORTED, CONVERSION_TIMEOUT, FILE_EMPTY, FILE_ENCODING_INVALID, FILE_PARSE_ERROR, MALFORMED_REQUEST, STRUCTURE_TOO_COMPLEX, VALIDATION_FAILED]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOrValidationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/FileTypeNotSupported'
        '503':
          description: Every conversion worker and the queue are busy; retry shortly.
          x-error-codes: [SERVICE_UNAVAILABLE]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/convert/formats:
    get:
      operationId: transformations_fileFormats
      tags: [transformations]
      summary: Supported file conversions
      security:
        - accessCookie: []
      responses:
        '200':
          description: Every source format with its targets.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
