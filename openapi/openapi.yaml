openapi: 3.1.0
info:
  title: File Converter API
  version: 0.1.0
  description: |
    Back End for converting files between CSV, JSON, XML, YAML and images between PNG, JPEG, SVG,
    with user accounts, e-mail confirmation and role-based access control.

    This document is written first (contract-first) and is the contract the frontend builds against.

    Conventions for every operation:
    - Every response carries `X-Request-Id`.
    - Every error response uses `ErrorEnvelope`; `x-error-codes` lists the `code` values a response
      can carry. Clients branch on `code`, never on `detail`.
    - `default` covers errors any request can hit (malformed body, body too large, unsupported
      encoding, unexpected server error).
    - Every path is under `/api`, except the monitoring endpoints `/health`, `/health/live` and
      `/health/ready`.
    - A path that does not exist answers `404` with `ErrorEnvelope` and code `ROUTE_NOT_FOUND`.
    - Operations with the `accessCookie` security requirement need a valid `access_token` cookie
      and answer `401 AUTH_UNAUTHENTICATED` without one. When it expires, call
      `POST /api/auth/refresh` and repeat the request; a `401 AUTH_REFRESH_INVALID` there means
      signing in again.
    - Operations under `/api/admin` also need a permission (`x-permission`, as
      `permission@action`); a signed-in user whose roles lack it gets `403 AUTH_FORBIDDEN`.
    - Endpoints with a stricter rate-limit group also send `X-RateLimit-*-<group>` and
      `Retry-After-<group>` headers; every `429` carries plain `Retry-After`.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: http://localhost:3001
    description: Local development
tags:
  - name: system
    description: Health checks and the API contract itself.
  - name: auth
    description: Registration, sign-in, e-mail confirmation (OTP or magic link), session and CSRF.
  - name: users
    description: User accounts.
  - name: rbac
    description: >-
      Roles, permissions and grants (role → permission → actions), stored in the database and
      applied without a restart. Every signed-in account implicitly holds the `user` role.
  - name: admin
    description: Runtime settings.
  - name: transformations
    description: >-
      File (CSV, JSON, XML, YAML) and image (PNG, JPEG, SVG) conversions and their history. Every attempt is recorded; a
      result can be saved for download.
security: []

paths:
  /health:
    get:
      operationId: health_check
      tags: [system]
      summary: Health check for monitoring (process and database)
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Default'

  /health/live:
    get:
      operationId: health_live
      tags: [system]
      summary: Liveness probe (process only, no dependencies)
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        default:
          $ref: '#/components/responses/Default'

  /health/ready:
    get:
      operationId: health_ready
      tags: [system]
      summary: Readiness probe (database reachable)
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Default'

  /api/docs:
    get:
      operationId: openApi_docs
      tags: [system]
      summary: Interactive Swagger UI for this contract
      description: >-
        Browser page that renders `/api/openapi.json` with "Try it out". Requests carry the
        session cookies, and the page copies the `csrf_token` cookie into `X-CSRF-Token`, so call
        `GET /api/auth/csrf` first.
      responses:
        '200':
          description: The HTML page.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/openapi.json:
    get:
      operationId: openApi_json
      tags: [system]
      summary: This contract as JSON
      responses:
        '200':
          description: The OpenAPI document.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/openapi.yaml:
    get:
      operationId: openApi_yaml
      tags: [system]
      summary: This contract as YAML (the source file)
      responses:
        '200':
          description: The OpenAPI document.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/yaml:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/csrf:
    get:
      operationId: auth_csrf
      tags: [auth]
      summary: Issue the CSRF cookie
      description: |
        Sets `csrf_token` (readable by JavaScript). Every unsafe request (POST, PUT, PATCH, DELETE)
        must echo it in the `X-CSRF-Token` header.
      responses:
        '204':
          description: Cookie set.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetCsrfCookie'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/register:
    post:
      operationId: auth_register
      tags: [auth]
      summary: Register with e-mail and password
      description: |
        When e-mail confirmation for registration is off (admin setting), the account is created
        active (201). When it is on, the account is created `pending_verification` and a 6-digit
        code plus a magic link are e-mailed (202); finish with `POST /api/auth/confirm` or
        `GET /api/auth/confirm?token=`.
      security:
        - csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered; the account is active.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '202':
          $ref: '#/components/responses/ConfirmationRequired'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          description: The e-mail is already registered.
          x-error-codes: [USER_EMAIL_TAKEN]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/login:
    post:
      operationId: auth_login
      tags: [auth]
      summary: Sign in with e-mail and password
      description: |
        When e-mail confirmation for sign-in is off (admin setting), the session cookies
        `access_token` (15 min) and `refresh_token` (30 days) are set (200). When it is on, no
        cookies are set: a code and a magic link are e-mailed (202) and the session is issued by
        `POST /api/auth/confirm` or `GET /api/auth/confirm?token=`.

        Wrong e-mail and wrong password answer the same 401. Only failed attempts count: five
        failures for one client IP and e-mail within a minute block that pair for 15 minutes
        (429 + `Retry-After`); a successful sign-in resets the count.

        With confirmation on, the 202 also sets `login_challenge` (HttpOnly, `Path=/api/auth/confirm`):
        the magic link signs in only in this browser.
      security:
        - csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; session cookies set.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '202':
          description: Sign-in pending; a code and a magic link were e-mailed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetLoginBindingCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationRequired'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Unknown e-mail or wrong password (indistinguishable).
          x-error-codes: [AUTH_INVALID_CREDENTIALS]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            CSRF check failed, the account's registration is not confirmed yet, or the account is
            blocked.
          x-error-codes: [AUTH_ACCOUNT_BLOCKED, AUTH_ACCOUNT_NOT_VERIFIED, CSRF_INVALID]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/confirm:
    post:
      operationId: auth_confirmWithCode
      tags: [auth]
      summary: Confirm a pending action with the e-mailed 6-digit code
      security:
        - csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmWithCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Confirmed'
        '400':
          $ref: '#/components/responses/ConfirmationFailed'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '423':
          $ref: '#/components/responses/ChallengeLocked'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    get:
      operationId: auth_confirmWithLink
      tags: [auth]
      summary: Confirm a pending action with the e-mailed magic link
      description: |
        Completes a registration, a sign-in (in the browser that started it), an e-mail change or
        an account deletion (the last two only where the account's owner is signed in: the
        `access_token` cookie is read). A sign-in sets session cookies; a deletion clears them.
      parameters:
        - name: login_challenge
          in: cookie
          required: false
          description: Set by `POST /api/auth/login`; required to confirm a sign-in by link.
          schema:
            $ref: '#/components/schemas/ChallengeId'
        - name: token
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MagicLinkToken'
      responses:
        '200':
          $ref: '#/components/responses/Confirmed'
        '400':
          $ref: '#/components/responses/ConfirmationFailed'
        '403':
          description: >-
            A sign-in link opened in another browser than the one that started it, or an account
            change (e-mail) opened where its owner is not signed in.
          x-error-codes: [AUTH_CHALLENGE_OTHER_BROWSER, AUTH_CHALLENGE_SESSION_REQUIRED]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: >-
            The new e-mail of an e-mail change was registered meanwhile, or a deletion would remove
            the last active admin.
          x-error-codes: [RBAC_LAST_ADMIN, USER_EMAIL_TAKEN]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '423':
          $ref: '#/components/responses/ChallengeLocked'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/confirm/resend:
    post:
      operationId: auth_resendConfirmation
      tags: [auth]
      summary: E-mail a new code and link for a pending challenge
      description: |
        Replaces the code and the link of the same challenge, resets the attempt counter and the
        10-minute expiry. Allowed once per 60 seconds per challenge.
      security:
        - csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendConfirmationRequest'
      responses:
        '202':
          description: >-
            A new code and link were e-mailed. For a sign-in resent from the browser that holds its
            `login_challenge` cookie, the cookie is renewed for the new 10 minutes.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: Renewed `login_challenge` cookie (sign-ins from the bound browser only).
              schema:
                type: string
                pattern: '^login_challenge=[0-9a-f-]{36};.*HttpOnly'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationRequired'
        '400':
          description: Invalid input or no pending challenge with this id.
          x-error-codes: [AUTH_CHALLENGE_INVALID, VALIDATION_FAILED]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/refresh:
    post:
      operationId: auth_refresh
      tags: [auth]
      summary: Exchange the refresh token for a new session
      description: |
        Reads the `refresh_token` cookie (sent only to this path) and, when it is valid and the
        account is still active, sets a **new pair** of `access_token` and `refresh_token`
        (rotation). Nothing about refresh tokens is stored on the server, so an earlier refresh
        token stays usable until it expires.

        Any failure answers 401 `AUTH_REFRESH_INVALID` and clears both session cookies: the user
        must sign in again.
      security:
        - csrfHeader: []
          csrfCookie: []
          refreshCookie: []
      responses:
        '204':
          description: New session cookies set.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
        '401':
          description: >-
            The refresh token is missing, invalid or expired, or the account was deleted,
            unconfirmed or had its sessions revoked.
          x-error-codes: [AUTH_REFRESH_INVALID]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/logout:
    post:
      operationId: auth_logout
      tags: [auth]
      summary: Sign out in this browser
      description: |
        Clears the session cookies (and a pending sign-in binding). Works with an expired access
        token too. Tokens are not stored on the server, so a refresh token copied elsewhere stays
        valid until it expires (Notion "Авторизация" 1.4).
      security:
        - csrfHeader: []
          csrfCookie: []
      responses:
        '204':
          description: Cookies cleared.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/me:
    get:
      operationId: users_me
      tags: [users]
      summary: The signed-in user
      description: Lets the client find out who is signed in, e.g. after a page reload.
      security:
        - accessCookie: []
      responses:
        '200':
          description: The current user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/users/{userId}:
    get:
      operationId: users_getProfile
      tags: [users]
      summary: A user's profile
      description: |
        One's own profile needs no permission; another user's needs `users@read`. Without it a
        foreign id answers 403 whether the account exists or not. Only the fields allowed for the
        audience are returned (default-deny): own profile `createdAt`, `displayName`,
        `lastLoginAt`, `status`; someone else's `createdAt`, `displayName`, `status`.
      x-permission: users@read (not needed for one's own profile)
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit-profile:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining-profile:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset-profile:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    patch:
      operationId: users_updateProfile
      tags: [users]
      summary: Change a user's profile
      description: |
        Self may change `displayName` only; the e-mail goes through `POST …/email-change`. With
        `users@update` any field may change, the e-mail directly. A field the caller may not
        change answers 403 with `context.fields`. `status: blocked` ends the account's sessions
        and is refused for the last active admin.
      x-permission: users@update (not needed to change one's own displayName)
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: The updated profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: The e-mail is taken, or the last active admin would be blocked.
          x-error-codes: [RBAC_LAST_ADMIN, USER_EMAIL_TAKEN]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    delete:
      operationId: users_delete
      tags: [users]
      summary: Delete an account
      description: |
        Self: only after an e-mailed confirmation — answers 202 with a pending confirmation,
        finished by `POST …/delete/confirm` (or the e-mailed link opened where signed in).
        Another account: needs `users@delete` (and `rbac@manage` when it administers RBAC) and is
        deleted at once, 204; deleting it again is a no-op 204.

        Deletion anonymises the account: e-mail, name, photo and files, roles and pending
        confirmations go, every session ends, the e-mail can be registered again. The last active
        admin cannot be deleted.
      x-permission: users@delete (not needed to request one's own deletion)
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
      responses:
        '202':
          description: Self-deletion pending; a code and a link went to the account's e-mail.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationRequired'
        '204':
          description: Deleted (or already deleted).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: The account is the last active admin.
          x-error-codes: [RBAC_LAST_ADMIN]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/users/{userId}/delete/confirm:
    post:
      operationId: users_confirmDeletion
      tags: [users]
      summary: Confirm one's account deletion
      description: |
        With `{ challengeId, code }` or the link's `{ token }`. Self only; the account is deleted
        and this browser's session cookies are cleared.
      x-permission: none — Self only
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerConfirmationRequest'
      responses:
        '204':
          description: Deleted; session cookies cleared.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
        '400':
          $ref: '#/components/responses/ConfirmationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '409':
          description: The account became the last active admin meanwhile.
          x-error-codes: [RBAC_LAST_ADMIN]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '423':
          $ref: '#/components/responses/ChallengeLocked'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/users/{userId}/email-change:
    post:
      operationId: users_startEmailChange
      tags: [users]
