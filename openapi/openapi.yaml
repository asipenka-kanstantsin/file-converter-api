openapi: 3.1.0
info:
  title: File Converter API
  version: 0.1.0
  description: |
    Back End for converting files between CSV, JSON, XML, YAML and images between PNG, JPEG, SVG,
    with user accounts, e-mail confirmation and role-based access control.

    This document is written first (contract-first) and is the contract the frontend builds against.

    Conventions for every operation:
    - Every response carries `X-Request-Id`.
    - Every error response uses `ErrorEnvelope`; `x-error-codes` lists the `code` values a response
      can carry. Clients branch on `code`, never on `detail`.
    - `default` covers errors any request can hit (malformed body, body too large, unsupported
      encoding, unexpected server error).
    - Every path is under `/api`, except the monitoring endpoints `/health`, `/health/live` and
      `/health/ready`.
    - A path that does not exist answers `404` with `ErrorEnvelope` and code `ROUTE_NOT_FOUND`.
    - Operations with the `accessCookie` security requirement need a valid `access_token` cookie
      and answer `401 AUTH_UNAUTHENTICATED` without one. When it expires, call
      `POST /api/auth/refresh` and repeat the request; a `401 AUTH_REFRESH_INVALID` there means
      signing in again.
    - Operations under `/api/admin` also need a permission (`x-permission`, as
      `permission@action`); a signed-in user whose roles lack it gets `403 AUTH_FORBIDDEN`.
    - Endpoints with a stricter rate-limit group also send `X-RateLimit-*-<group>` and
      `Retry-After-<group>` headers; every `429` carries plain `Retry-After`.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: http://localhost:3001
    description: Local development
tags:
  - name: system
    description: Health checks and the API contract itself.
  - name: auth
    description: Registration, sign-in, e-mail confirmation (OTP or magic link), session and CSRF.
  - name: users
    description: User accounts.
  - name: rbac
    description: >-
      Roles, permissions and grants (role → permission → actions), stored in the database and
      applied without a restart. Every signed-in account implicitly holds the `user` role.
  - name: admin
    description: Runtime settings.
security: []

paths:
  /health:
    get:
      operationId: health_check
      tags: [system]
      summary: Health check for monitoring (process and database)
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Default'

  /health/live:
    get:
      operationId: health_live
      tags: [system]
      summary: Liveness probe (process only, no dependencies)
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        default:
          $ref: '#/components/responses/Default'

  /health/ready:
    get:
      operationId: health_ready
      tags: [system]
      summary: Readiness probe (database reachable)
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Default'

  /api/openapi.json:
    get:
      operationId: openApi_json
      tags: [system]
      summary: This contract as JSON
      responses:
        '200':
          description: The OpenAPI document.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/openapi.yaml:
    get:
      operationId: openApi_yaml
      tags: [system]
      summary: This contract as YAML (the source file)
      responses:
        '200':
          description: The OpenAPI document.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/yaml:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/csrf:
    get:
      operationId: auth_csrf
      tags: [auth]
      summary: Issue the CSRF cookie
      description: |
        Sets `csrf_token` (readable by JavaScript). Every unsafe request (POST, PUT, PATCH, DELETE)
        must echo it in the `X-CSRF-Token` header.
      responses:
        '204':
          description: Cookie set.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetCsrfCookie'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/register:
    post:
      operationId: auth_register
      tags: [auth]
      summary: Register with e-mail and password
      description: |
        When e-mail confirmation for registration is off (admin setting), the account is created
        active (201). When it is on, the account is created `pending_verification` and a 6-digit
        code plus a magic link are e-mailed (202); finish with `POST /api/auth/confirm` or
        `GET /api/auth/confirm?token=`.
      security:
        - csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered; the account is active.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '202':
          $ref: '#/components/responses/ConfirmationRequired'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          description: The e-mail is already registered.
          x-error-codes: [USER_EMAIL_TAKEN]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/login:
    post:
      operationId: auth_login
      tags: [auth]
      summary: Sign in with e-mail and password
      description: |
        When e-mail confirmation for sign-in is off (admin setting), the session cookies
        `access_token` (15 min) and `refresh_token` (30 days) are set (200). When it is on, no
        cookies are set: a code and a magic link are e-mailed (202) and the session is issued by
        `POST /api/auth/confirm` or `GET /api/auth/confirm?token=`.

        Wrong e-mail and wrong password answer the same 401. Only failed attempts count: five
        failures for one client IP and e-mail within a minute block that pair for 15 minutes
        (429 + `Retry-After`); a successful sign-in resets the count.

        With confirmation on, the 202 also sets `login_challenge` (HttpOnly, `Path=/api/auth/confirm`):
        the magic link signs in only in this browser.
      security:
        - csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; session cookies set.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '202':
          description: Sign-in pending; a code and a magic link were e-mailed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetLoginBindingCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationRequired'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Unknown e-mail or wrong password (indistinguishable).
          x-error-codes: [AUTH_INVALID_CREDENTIALS]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF check failed, or the account's registration is not confirmed yet.
          x-error-codes: [AUTH_ACCOUNT_NOT_VERIFIED, CSRF_INVALID]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/confirm:
    post:
      operationId: auth_confirmWithCode
      tags: [auth]
      summary: Confirm a pending action with the e-mailed 6-digit code
      security:
        - csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmWithCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Confirmed'
        '400':
          $ref: '#/components/responses/ConfirmationFailed'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '423':
          $ref: '#/components/responses/ChallengeLocked'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    get:
      operationId: auth_confirmWithLink
      tags: [auth]
      summary: Confirm a pending action with the e-mailed magic link
      parameters:
        - name: login_challenge
          in: cookie
          required: false
          description: Set by `POST /api/auth/login`; required to confirm a sign-in by link.
          schema:
            $ref: '#/components/schemas/ChallengeId'
        - name: token
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MagicLinkToken'
      responses:
        '200':
          $ref: '#/components/responses/Confirmed'
        '400':
          $ref: '#/components/responses/ConfirmationFailed'
        '403':
          description: >-
            A sign-in link opened in a different browser than the one that started the sign-in
            (no matching `login_challenge` cookie). Use that browser, or the code.
          x-error-codes: [AUTH_CHALLENGE_OTHER_BROWSER]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '423':
          $ref: '#/components/responses/ChallengeLocked'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/confirm/resend:
    post:
      operationId: auth_resendConfirmation
      tags: [auth]
      summary: E-mail a new code and link for a pending challenge
      description: |
        Replaces the code and the link of the same challenge, resets the attempt counter and the
        10-minute expiry. Allowed once per 60 seconds per challenge.
      security:
        - csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendConfirmationRequest'
      responses:
        '202':
          description: >-
            A new code and link were e-mailed. For a sign-in resent from the browser that holds its
            `login_challenge` cookie, the cookie is renewed for the new 10 minutes.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: Renewed `login_challenge` cookie (sign-ins from the bound browser only).
              schema:
                type: string
                pattern: '^login_challenge=[0-9a-f-]{36};.*HttpOnly'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationRequired'
        '400':
          description: Invalid input or no pending challenge with this id.
          x-error-codes: [AUTH_CHALLENGE_INVALID, VALIDATION_FAILED]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/refresh:
    post:
      operationId: auth_refresh
      tags: [auth]
      summary: Exchange the refresh token for a new session
      description: |
        Reads the `refresh_token` cookie (sent only to this path) and, when it is valid and the
        account is still active, sets a **new pair** of `access_token` and `refresh_token`
        (rotation). Nothing about refresh tokens is stored on the server, so an earlier refresh
        token stays usable until it expires.

        Any failure answers 401 `AUTH_REFRESH_INVALID` and clears both session cookies: the user
        must sign in again.
      security:
        - csrfHeader: []
          csrfCookie: []
          refreshCookie: []
      responses:
        '204':
          description: New session cookies set.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
        '401':
          description: >-
            The refresh token is missing, invalid or expired, or the account was deleted,
            unconfirmed or had its sessions revoked.
          x-error-codes: [AUTH_REFRESH_INVALID]
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/auth/logout:
    post:
      operationId: auth_logout
      tags: [auth]
      summary: Sign out in this browser
      description: |
        Clears the session cookies (and a pending sign-in binding). Works with an expired access
        token too. Tokens are not stored on the server, so a refresh token copied elsewhere stays
        valid until it expires (Notion "Авторизация" 1.4).
      security:
        - csrfHeader: []
          csrfCookie: []
      responses:
        '204':
          description: Cookies cleared.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/me:
    get:
      operationId: users_me
      tags: [users]
      summary: The signed-in user
      description: Lets the client find out who is signed in, e.g. after a page reload.
      security:
        - accessCookie: []
      responses:
        '200':
          description: The current user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/admin/rbac/roles:
    get:
      operationId: rbac_listRoles
      tags: [rbac]
      summary: List roles
      x-permission: rbac@manage
      security:
        - accessCookie: []
      responses:
        '200':
          description: All roles, by name.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    post:
      operationId: rbac_createRole
      tags: [rbac]
      summary: Create a role
      x-permission: rbac@manage
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '409':
          $ref: '#/components/responses/RoleConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/admin/rbac/roles/{roleId}:
    put:
      operationId: rbac_updateRole
      tags: [rbac]
      summary: Update a role
      description: |
        Replaces name and description. The built-in roles `admin` and `user` cannot be renamed.
      x-permission: rbac@manage
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: Updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/RoleNotFound'
        '409':
          $ref: '#/components/responses/RoleConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    delete:
      operationId: rbac_deleteRole
      tags: [rbac]
      summary: Delete a role
      description: |
        Refused (409 `RBAC_IN_USE`) while grants or users still hold the role; built-in roles cannot be
        deleted (409 `RBAC_SYSTEM_ENTITY`).
      x-permission: rbac@manage
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '204':
          description: Deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/RoleNotFound'
        '409':
          $ref: '#/components/responses/InUseOrSystem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/admin/rbac/permissions:
    get:
      operationId: rbac_listPermissions
      tags: [rbac]
      summary: List permissions
      x-permission: rbac@manage
      security:
        - accessCookie: []
      responses:
        '200':
          description: All permissions, by name.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    post:
      operationId: rbac_createPermission
      tags: [rbac]
      summary: Create a permission
      x-permission: rbac@manage
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionInput'
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '409':
          $ref: '#/components/responses/PermissionConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/admin/rbac/permissions/{permissionId}:
    put:
      operationId: rbac_updatePermission
      tags: [rbac]
      summary: Update a permission
      description: |
        Replaces name and actions. An action still listed by a grant cannot be removed
        (409 `RBAC_ACTION_IN_USE`, `context.actions`). The permissions the API itself checks (`system: true`)
        are read-only.
      x-permission: rbac@manage
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      parameters:
        - $ref: '#/components/parameters/PermissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionInput'
      responses:
        '200':
          description: Updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/PermissionNotFound'
        '409':
          $ref: '#/components/responses/PermissionConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    delete:
      operationId: rbac_deletePermission
      tags: [rbac]
      summary: Delete a permission
      description: |
        Refused while grants reference it, and for built-in permissions.
      x-permission: rbac@manage
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      parameters:
        - $ref: '#/components/parameters/PermissionId'
      responses:
        '204':
          description: Deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/PermissionNotFound'
        '409':
          $ref: '#/components/responses/InUseOrSystem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/admin/rbac/grants:
    get:
      operationId: rbac_listGrants
      tags: [rbac]
      summary: List grants
      x-permission: rbac@manage
      security:
        - accessCookie: []
      responses:
        '200':
          description: All grants, oldest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    post:
      operationId: rbac_createGrant
      tags: [rbac]
      summary: Grant a permission to a role
      description: |
        No or empty `actions` = every action of the permission; otherwise only the listed ones, which
        must be actions of the permission (400 `RBAC_ACTION_NOT_ALLOWED`). One grant per role and
        permission (409 `RBAC_GRANT_DUPLICATE`).
      x-permission: rbac@manage
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantEnvelope'
        '400':
          $ref: '#/components/responses/GrantInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/GrantTargetNotFound'
        '409':
          $ref: '#/components/responses/GrantConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/admin/rbac/grants/{grantId}:
    put:
      operationId: rbac_updateGrant
      tags: [rbac]
      summary: Update a grant
      description: |
        The grant `admin → rbac` (`system: true`) keeps every action and cannot be moved.
      x-permission: rbac@manage
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      parameters:
        - $ref: '#/components/parameters/GrantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
      responses:
        '200':
          description: Updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantEnvelope'
        '400':
          $ref: '#/components/responses/GrantInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/GrantTargetNotFound'
        '409':
          $ref: '#/components/responses/GrantConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    delete:
      operationId: rbac_deleteGrant
      tags: [rbac]
      summary: Delete a grant
      x-permission: rbac@manage
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      parameters:
        - $ref: '#/components/parameters/GrantId'
      responses:
        '204':
          description: Deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/GrantNotFound'
        '409':
          $ref: '#/components/responses/SystemEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/admin/users/{userId}/roles:
    get:
      operationId: rbac_getUserRoles
      tags: [rbac]
      summary: A user's roles
      x-permission: rbac@manage
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The explicitly assigned roles.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    put:
      operationId: rbac_setUserRoles
      tags: [rbac]
      summary: Replace a user's roles
      description: |
        Takes effect on the user's next request. The implicit `user` role cannot be assigned
        (409 `RBAC_SYSTEM_ENTITY`), and the last holder of `admin` cannot lose it (409 `RBAC_LAST_ADMIN`).
      x-permission: rbac@manage
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRolesInput'
      responses:
        '200':
          description: The roles now assigned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/UserOrRoleNotFound'
        '409':
          $ref: '#/components/responses/UserRolesConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

  /api/admin/settings:
    get:
      operationId: admin_getSettings
      tags: [admin]
      summary: Runtime settings
      x-permission: settings@manage
      security:
        - accessCookie: []
      responses:
        '200':
          description: Every setting with its current value.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'
    patch:
      operationId: admin_updateSettings
      tags: [admin]
      summary: Change runtime settings
      description: |
        Switches e-mail confirmation per scenario without a deploy. Only the given keys change;
        unknown keys are refused.
      x-permission: settings@manage
      security:
        - accessCookie: []
          csrfHeader: []
          csrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Every setting after the change.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Default'

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Access JWT (15 min), set by sign-in, confirmation and refresh.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh JWT (30 days), sent by the browser only to `POST /api/auth/refresh`.
    csrfCookie:
      type: apiKey
      in: cookie
      name: csrf_token
      description: Set by `GET /api/auth/csrf`.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must equal the `csrf_token` cookie (double submit).

  parameters:
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    SetSessionCookies:
      description: >-
        `access_token=<JWT>; Path=/api; HttpOnly; SameSite=Lax` (15 min) and
        `refresh_token=<JWT>; Path=/api/auth/refresh; HttpOnly; SameSite=Lax` (30 days); `Secure`
        outside local development.
      required: true
      schema:
        type: string
        pattern: '^(access|refresh)_token=[\w-]+\.[\w-]+\.[\w-]+;.*HttpOnly'
    ClearSessionCookies:
      description: >-
        Expires `access_token` (`Path=/api`) and `refresh_token` (`Path=/api/auth/refresh`) with
        the same attributes they were set with; logout also expires `login_challenge`.
      required: true
      schema:
        type: string
        pattern: '^(access_token|refresh_token|login_challenge)=;.*Expires=Thu, 01 Jan 1970'
    SetLoginBindingCookie:
      description: '`login_challenge=<challengeId>; Path=/api/auth/confirm; HttpOnly; SameSite=Lax` (10 min).'
      required: true
      schema:
        type: string
        pattern: '^login_challenge=[0-9a-f-]{36};.*HttpOnly'
    SetCsrfCookie:
      description: '`csrf_token=<random>; Path=/; SameSite=Lax` (not HttpOnly, so the client can echo it).'
      required: true
      schema:
        type: string
        pattern: '^csrf_token=[A-Za-z0-9_-]{43};'
    RequestId:
      description: Request id — echoed from a valid incoming `X-Request-Id` or generated.
      required: true
      schema:
        type: string
        pattern: '^[\w-]{1,64}$'
    RetryAfter:
      description: Seconds until the client may retry.
      required: true
      schema:
        type: integer
        minimum: 1
    RateLimitLimit:
      description: Requests allowed in the current window.
      required: true
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests left in the current window.
      required: true
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the window resets.
      required: true
      schema:
        type: integer
        minimum: 0

  schemas:
    ErrorCode:
      type: string
      description: Stable machine-readable error code. Clients branch on it, never on `detail`.
      enum:
        - AUTH_ACCOUNT_NOT_VERIFIED
        - AUTH_CHALLENGE_EXPIRED
        - AUTH_CHALLENGE_INVALID
        - AUTH_CHALLENGE_LOCKED
        - AUTH_CHALLENGE_OTHER_BROWSER
        - AUTH_CODE_INVALID
        - AUTH_FORBIDDEN
        - AUTH_INVALID_CREDENTIALS
        - AUTH_REFRESH_INVALID
        - AUTH_UNAUTHENTICATED
        - CONFLICT
        - CSRF_INVALID
        - INTERNAL_ERROR
        - MALFORMED_REQUEST
        - PAYLOAD_TOO_LARGE
        - RATE_LIMITED
        - RBAC_ACTION_IN_USE
        - RBAC_ACTION_NOT_ALLOWED
        - RBAC_GRANT_DUPLICATE
        - RBAC_GRANT_NOT_FOUND
        - RBAC_IN_USE
        - RBAC_LAST_ADMIN
        - RBAC_PERMISSION_NAME_TAKEN
        - RBAC_PERMISSION_NOT_FOUND
        - RBAC_ROLE_NAME_TAKEN
        - RBAC_ROLE_NOT_FOUND
        - RBAC_SYSTEM_ENTITY
        - REQUEST_REJECTED
        - ROUTE_NOT_FOUND
        - SERVICE_UNAVAILABLE
        - UNSUPPORTED_MEDIA_TYPE
        - USER_EMAIL_TAKEN
        - USER_NOT_ACTIVE
        - USER_NOT_FOUND
        - VALIDATION_FAILED

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, detail]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Human-readable message (English). Display only; never parse it.
        context:
          type: object
          description: Safe, code-specific details; each response documents its own shape.

    RateLimitedEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            code:
              const: RATE_LIMITED
            context:
              type: object
              additionalProperties: false
              required: [retryAfter]
              properties:
                retryAfter:
                  type: integer
                  minimum: 1
                  description: Seconds until the client may retry (same as `Retry-After`).

    ServiceUnavailableEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [context]
          properties:
            code:
              const: SERVICE_UNAVAILABLE
            context:
              type: object
              additionalProperties: false
              required: [checks]
              properties:
                checks:
                  $ref: '#/components/schemas/HealthChecks'

    ValidationErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [context]
          properties:
            code:
              const: VALIDATION_FAILED
            context:
              type: object
              additionalProperties: false
              required: [fields]
              properties:
                fields:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [code, detail, path]
                    properties:
                      code:
                        type: string
                        description: zod issue code, e.g. `too_small`, `invalid_format`.
                      detail:
                        type: string
                      path:
                        type: string
                        description: Dot-joined field path, e.g. `email`.

    CodeInvalidEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [context]
          properties:
            code:
              const: AUTH_CODE_INVALID
            context:
              type: object
              additionalProperties: false
              required: [attemptsLeft]
              properties:
                attemptsLeft:
                  type: integer
                  minimum: 1

    Email:
      type: string
      format: email
      maxLength: 254
      description: Trimmed and lower-cased by the server.
      examples: [jane@example.com]

    Password:
      type: string
      minLength: 8
      maxLength: 128
      description: 8–128 characters with at least one letter and one digit.
      writeOnly: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'

    User:
      type: object
      additionalProperties: false
      required: [createdAt, email, id, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, pending_verification]
        createdAt:
          type: string
          format: date-time

    UserEnvelope:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    RoleName:
      type: string
      pattern: '^[a-z][a-z0-9_-]{1,49}$'
    PermissionName:
      type: string
      pattern: '^[a-z][a-z0-9.\-_]{1,63}$'
    Action:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,31}$'
    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/RoleName'
        description:
          type: string
          maxLength: 500
    Role:
      type: object
      additionalProperties: false
      required: [id, name, description, system, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        system:
          type: boolean
          description: Built in (`admin`, `user`); cannot be renamed or deleted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoleEnvelope:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'
    RoleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    PermissionInput:
      type: object
      required: [name, actions]
      properties:
        name:
          $ref: '#/components/schemas/PermissionName'
        actions:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Action'
    Permission:
      type: object
      additionalProperties: false
      required: [id, name, actions, system, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        actions:
          type: array
          items:
            type: string
        system:
          type: boolean
          description: Checked by the API itself; read-only.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PermissionEnvelope:
      type: object
      additionalProperties: false
      required: [permission]
      properties:
        permission:
          $ref: '#/components/schemas/Permission'
    PermissionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    GrantInput:
      type: object
      required: [roleId, permissionId]
      properties:
        roleId:
          type: string
          format: uuid
        permissionId:
          type: string
          format: uuid
        actions:
          type: array
          maxItems: 32
          uniqueItems: true
          description: Omitted or empty = every action of the permission.
          items:
            $ref: '#/components/schemas/Action'
    Grant:
      type: object
      additionalProperties: false
      required: [id, roleId, permissionId, actions, system, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        permissionId:
          type: string
          format: uuid
        actions:
          type: array
          description: Empty = every action of the permission.
          items:
            type: string
        system:
          type: boolean
          description: The protected grant `admin → rbac`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GrantEnvelope:
      type: object
      additionalProperties: false
      required: [grant]
      properties:
        grant:
          $ref: '#/components/schemas/Grant'
    GrantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
    UserRolesInput:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            format: uuid
    UserRoles:
      type: object
      additionalProperties: false
      required: [userId, roleIds]
      properties:
        userId:
          type: string
          format: uuid
        roleIds:
          type: array
          description: Explicitly assigned roles; the implicit `user` role is not listed.
          items:
            type: string
            format: uuid
    Settings:
      type: object
      additionalProperties: false
      required: [confirmation.login, confirmation.registration]
      properties:
        confirmation.login:
          type: boolean
          description: Sign-in needs an e-mailed code or link.
        confirmation.registration:
          type: boolean
          description: Registration needs an e-mailed code or link.
    SettingsEnvelope:
      type: object
      additionalProperties: false
      required: [settings]
      properties:
        settings:
          $ref: '#/components/schemas/Settings'
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        confirmation.login:
          type: boolean
        confirmation.registration:
          type: boolean

    ErrorOrValidationEnvelope:
      anyOf:
        - $ref: '#/components/schemas/ValidationErrorEnvelope'
        - $ref: '#/components/schemas/ErrorEnvelope'

    ChallengeId:
      type: string
      format: uuid
      description: Identifies a pending e-mail confirmation.

    ConfirmationRequired:
      type: object
      additionalProperties: false
      required: [challengeId, expiresAt, requiresConfirmation]
      properties:
        requiresConfirmation:
          const: true
        challengeId:
          $ref: '#/components/schemas/ChallengeId'
        expiresAt:
          type: string
          format: date-time
          description: When the e-mailed code and link stop working.

    ConfirmWithCodeRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId:
          $ref: '#/components/schemas/ChallengeId'
        code:
          type: string
          pattern: '^\d{6}$'
          writeOnly: true

    MagicLinkToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'

    ResendConfirmationRequest:
      type: object
      required: [challengeId]
      properties:
        challengeId:
          $ref: '#/components/schemas/ChallengeId'

    HealthChecks:
      type: object
      additionalProperties: false
      properties:
        database:
          type: string
          enum: [down, up]

    HealthReport:
      type: object
      additionalProperties: false
      required: [checks, status]
      properties:
        status:
          const: ok
        checks:
          $ref: '#/components/schemas/HealthChecks'

  responses:
    Healthy:
      description: Healthy.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthReport'
    ValidationFailed:
      description: Invalid input.
      x-error-codes: [VALIDATION_FAILED]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    Unauthenticated:
      description: >-
        No valid `access_token` cookie: missing, expired, tampered, or the account is no longer
        active or had its sessions revoked. Refresh the session and repeat the request.
      x-error-codes: [AUTH_UNAUTHENTICATED]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The caller's roles lack the operation's permission (`x-permission`).
      x-error-codes: [AUTH_FORBIDDEN]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenOrCsrf:
      description: The caller's roles lack the permission, or the CSRF check failed.
      x-error-codes: [AUTH_FORBIDDEN, CSRF_INVALID]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RoleNotFound:
      description: No role with this id.
      x-error-codes: [RBAC_ROLE_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionNotFound:
      description: No permission with this id.
      x-error-codes: [RBAC_PERMISSION_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GrantNotFound:
      description: No grant with this id.
      x-error-codes: [RBAC_GRANT_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GrantTargetNotFound:
      description: No such grant, role or permission.
      x-error-codes: [RBAC_GRANT_NOT_FOUND, RBAC_PERMISSION_NOT_FOUND, RBAC_ROLE_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UserNotFound:
      description: No user with this id.
      x-error-codes: [USER_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UserOrRoleNotFound:
      description: No such user, or a listed role does not exist (`context.roleId`).
      x-error-codes: [RBAC_ROLE_NOT_FOUND, USER_NOT_FOUND]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RoleConflict:
      description: The name is taken, or a built-in role would be renamed.
      x-error-codes: [RBAC_ROLE_NAME_TAKEN, RBAC_SYSTEM_ENTITY]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionConflict:
      description: The name is taken, an action to remove is still granted (`context.actions`), or the permission is built in.
      x-error-codes: [RBAC_ACTION_IN_USE, RBAC_PERMISSION_NAME_TAKEN, RBAC_SYSTEM_ENTITY]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GrantConflict:
      description: >-
        The role already has a grant for this permission, the protected grant would change, or
        `rbac` would go to the implicit `user` role (every account would become an admin).
      x-error-codes: [RBAC_GRANT_DUPLICATE, RBAC_SYSTEM_ENTITY]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GrantInvalid:
      description: Invalid input, or actions the permission does not have (`context.actions`).
      x-error-codes: [RBAC_ACTION_NOT_ALLOWED, VALIDATION_FAILED]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOrValidationEnvelope'
    InUseOrSystem:
      description: Still referenced by grants or users, or built in.
      x-error-codes: [RBAC_IN_USE, RBAC_SYSTEM_ENTITY]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SystemEntity:
      description: The protected grant cannot be deleted.
      x-error-codes: [RBAC_SYSTEM_ENTITY]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UserRolesConflict:
      description: >-
        The implicit `user` role was listed, the last active admin would lose `admin`, or the
        account has not confirmed its registration (only active accounts hold roles).
      x-error-codes: [RBAC_LAST_ADMIN, RBAC_SYSTEM_ENTITY, USER_NOT_ACTIVE]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CsrfInvalid:
      description: The `X-CSRF-Token` header is missing or does not match the `csrf_token` cookie.
      x-error-codes: [CSRF_INVALID]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConfirmationRequired:
      description: >-
        A code and a magic link were e-mailed; the registration or sign-in completes after
        confirmation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfirmationRequired'
    Confirmed:
      description: >-
        The pending action is complete. Confirming a sign-in also sets the session cookies
        (`Set-Cookie` as for `POST /api/auth/login`); confirming a registration sets none.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Set-Cookie:
          description: Session cookies, only when a sign-in was confirmed.
          schema:
            type: string
            pattern: '^(access|refresh)_token=[\w-]+\.[\w-]+\.[\w-]+;.*HttpOnly'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserEnvelope'
    ConfirmationFailed:
      description: >-
        Invalid input, unknown or already used challenge or link, expired challenge, or a wrong
        code (`context.attemptsLeft`).
      x-error-codes:
        - AUTH_CHALLENGE_EXPIRED
        - AUTH_CHALLENGE_INVALID
        - AUTH_CODE_INVALID
        - VALIDATION_FAILED
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ValidationErrorEnvelope'
              - $ref: '#/components/schemas/CodeInvalidEnvelope'
              - allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - properties:
                      code:
                        enum: [AUTH_CHALLENGE_EXPIRED, AUTH_CHALLENGE_INVALID]
    ChallengeLocked:
      description: Too many wrong codes; request a new code with `POST /api/auth/confirm/resend`.
      x-error-codes: [AUTH_CHALLENGE_LOCKED]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many requests.
      x-error-codes: [RATE_LIMITED]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitedEnvelope'
    ServiceUnavailable:
      description: A dependency is down.
      x-error-codes: [SERVICE_UNAVAILABLE]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableEnvelope'
    Default:
      description: >-
        Error any request can hit: unparsable or too large body, unsupported content
        encoding, a client error rejected by the framework, or an unexpected server error.
      x-error-codes:
        - INTERNAL_ERROR
        - MALFORMED_REQUEST
        - PAYLOAD_TOO_LARGE
        - REQUEST_REJECTED
        - UNSUPPORTED_MEDIA_TYPE
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
