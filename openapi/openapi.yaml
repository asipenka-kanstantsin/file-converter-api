        - $ref: '#/components/parameters/UserId'
        - name: itemId
          in: path
          required: true
          description: The history item.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The saved result, streamed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Content-Disposition:
              required: true
              schema:
                type: string
                pattern: '^attachment; filename="[\w.-]+"$'
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema: {}
            application/xml:
              schema:
                type: string
            application/yaml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
        '400':
